[project]
name = "linkedin-cli"
version = "0.1.0"
description = "A zero-dependency LinkedIn CLI for AI agents and humans."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
linkedin = "linkedin_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
